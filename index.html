<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0b0b"><link rel="manifest" href="./manifest.webmanifest"><title>ZONA</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#080808;color:#eee;font-family:Arial,sans-serif}button{font:inherit;color:inherit}
#app{max-width:1500px;margin:auto;min-height:100vh;background:#0c0c0c;display:grid;grid-template-rows:78px minmax(520px,1fr) 104px}
.top{display:grid;grid-template-columns:1.35fr repeat(3,1fr);gap:5px;padding:5px;background:#070707}.topbox,.panel,.navbtn,.bottom button{border:2px solid #090909;box-shadow:inset 0 0 0 1px #4d443e;background:linear-gradient(#262421,#121211);border-radius:7px}.topbox{display:flex;align-items:center;padding:8px 14px;font-weight:900;font-size:24px}.profile{gap:10px}.avatar{width:52px;height:52px;border-radius:5px;background:#713323;display:grid;place-items:center;font-size:31px}.nick{font-size:24px}.tiny{font-size:12px;color:#d6aa76;margin-top:3px}.resource{justify-content:center;gap:9px}.resource b{color:#ffb13b}.resource.money b{color:#7de17d}
.main{display:grid;grid-template-columns:210px minmax(0,1fr) 330px;gap:6px;padding:6px;min-height:0}.left,.right{display:flex;flex-direction:column;gap:6px}.navbtn{min-height:82px;text-align:left;padding:10px 12px;font-weight:900;font-size:18px;position:relative;overflow:hidden}.navbtn small{display:block;color:#9c948e;font-size:11px;margin-top:4px}.navbtn.active{outline:2px solid #e54b25;box-shadow:inset 0 0 18px #5c190d}.navbtn.lock{opacity:.55}.center{position:relative;overflow:hidden;border:2px solid #33271f;border-radius:7px;background:#19130f}.scene{width:100%;height:100%;object-fit:cover;display:block;animation:breathe 4.5s ease-in-out infinite;transform-origin:50% 55%}@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.012)}}@media(prefers-reduced-motion:reduce){.scene{animation:none}}
.equip{position:absolute;pointer-events:none;filter:drop-shadow(0 4px 3px #0009);display:none}.equip.on{display:block}.eq-jacket{width:23%;left:40%;top:30%;opacity:.82}.eq-chain{width:11%;left:46%;top:30%}.eq-glasses{width:8%;left:47.5%;top:25%}.eq-hat{width:10%;left:46.5%;top:18%}.eq-watch{width:4%;left:57%;top:49%}.eq-boots{width:20%;left:42%;bottom:2%;opacity:.9}
.panel{padding:13px;background:linear-gradient(#21170f,#100d0b);border-color:#4b2817}.panel h2{margin:0 0 10px;color:#f2bd65;font-size:19px}.task{padding:10px 0;border-top:1px solid #4a3528}.task:first-of-type{border-top:0}.task b{display:block}.muted{color:#a89f98;font-size:12px;margin:4px 0}.btn{background:linear-gradient(#d24b2c,#8b2114);border:1px solid #ef7348;border-radius:6px;padding:8px 11px;font-weight:800;min-height:40px}.btn:disabled{filter:grayscale(1);opacity:.5}.stats{margin-top:auto}.stat{display:grid;grid-template-columns:1fr auto;gap:6px;margin:8px 0}.bar{grid-column:1/3;height:7px;border-radius:8px;background:#080808;overflow:hidden}.fill{height:100%;background:#d34a29}
.bottom{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;padding:5px;background:#070707}.bottom button{font-weight:900;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0}.bottom img{height:45px;max-width:62px}.bottom .emoji{font-size:34px;height:45px}.bottom button.active{outline:2px solid #e6532a}
.drawer{position:absolute;inset:8px;z-index:8;background:linear-gradient(180deg,#1d1713,#0d0c0b);border:2px solid #8d4927;border-radius:9px;padding:15px;overflow:auto;display:none}.drawer.open{display:block}.drawerhead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #6b3c26;padding-bottom:10px;margin-bottom:12px}.drawer h2{margin:0;color:#ffc36b}.close{width:44px;height:44px;background:#38170f;border:1px solid #934626;border-radius:7px;font-size:24px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:#171717;border:1px solid #50463f;border-radius:8px;padding:11px}.card.selected{outline:2px solid #ef6335}.art{height:95px;width:100%;object-fit:contain;background:#0c0c0c;border-radius:6px;padding:6px}.card h3{margin:8px 0 3px}.price{color:#f5c064;font-weight:900}.tag{display:inline-block;background:#352116;color:#f0b76c;padding:3px 6px;border-radius:4px;font-size:11px}.bossbox{display:grid;grid-template-columns:120px 1fr;gap:15px}.bossface{font-size:75px;background:#24140f;display:grid;place-items:center;border-radius:8px}.toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:20;background:#080808e8;border:1px solid #b8552d;border-radius:7px;padding:10px 15px;font-weight:800;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}.rotate{display:none}
@media(max-width:950px){#app{grid-template-rows:60px minmax(390px,1fr) 78px}.topbox{font-size:15px;padding:5px}.avatar{width:40px;height:40px}.nick{font-size:15px}.main{grid-template-columns:145px minmax(0,1fr) 220px}.navbtn{min-height:58px;font-size:13px}.panel{padding:8px}.panel h2{font-size:14px}.task{font-size:12px;padding:6px 0}.bottom button{font-size:10px}.bottom img{height:32px}.bottom .emoji{font-size:25px;height:32px}.grid{grid-template-columns:repeat(2,1fr)}.art{height:70px}}
@media(orientation:portrait) and (max-width:800px){.rotate{display:flex;position:fixed;inset:0;z-index:99;background:#080808;align-items:center;justify-content:center;text-align:center;font-size:22px;font-weight:900;padding:30px}.rotate:after{content:" ↻";color:#f16a36;font-size:42px}}
</style></head><body>
<div id="app">
<header class="top"><div class="topbox profile"><div class="avatar">👤</div><div><div class="nick">SMA1LTVX</div><div class="tiny"><span id="status">Новенький</span> · ур. <span id="level">1</span> · XP <span id="xp">0</span>/100</div></div></div><div class="topbox resource">⚡ <b><span id="energy">10</span>/10</b></div><div class="topbox resource money">💵 <b id="money">750</b></div><div class="topbox resource">🪙 <b id="coins">7</b></div></header>
<main class="main">
<aside class="left"><button class="navbtn" data-section="pass">🏚️ ПРОХОДНАЯ<small>Начало пути</small></button><button class="navbtn lock" id="yard">🌫️ ДВОР<small>Нужен статус «Свой»</small></button><button class="navbtn active">🛏️ КАМЕРА<small>Твоя территория</small></button><button class="navbtn lock" id="fight">👊 РАЗБОРКИ<small>Откроется позже</small></button><button class="navbtn" data-open="boss">☠️ БОССЫ<small>Шрам ждёт</small></button><button class="navbtn" data-open="shop">🧰 МАГАЗИН<small>Шмот и аксессуары</small></button></aside>
<section class="center"><img class="scene" src="./cell_scene.jpg" alt="Камера">
<img id="ov-jacket" class="equip eq-jacket" src="./jacket.svg"><img id="ov-chain" class="equip eq-chain" src="./chain.svg"><img id="ov-glasses" class="equip eq-glasses" src="./glasses.svg"><img id="ov-hat" class="equip eq-hat" src="./hat.svg"><img id="ov-watch" class="equip eq-watch" src="./watch.svg"><img id="ov-boots" class="equip eq-boots" src="./boots.svg">
<div id="drawer" class="drawer"><div class="drawerhead"><h2 id="drawTitle">Раздел</h2><button class="close" id="close">×</button></div><div id="drawBody"></div></div><div class="toast" id="toast"></div></section>
<aside class="right"><section class="panel"><h2>📋 МОИ ЗАДАНИЯ</h2><div class="task"><b>Познакомиться с соседом</b><div class="muted">⚡1 · +50 ₽ · +10 XP</div><button class="btn taskbtn" data-t="0">Выполнить</button></div><div class="task"><b>Убрать камеру</b><div class="muted">⚡2 · +90 ₽ · +15 XP</div><button class="btn taskbtn" data-t="1">Выполнить</button></div><div class="task"><b>Передать маляву</b><div class="muted">⚡3 · +150 ₽ · +25 XP</div><button class="btn taskbtn" data-t="2">Выполнить</button></div></section><section class="panel stats"><h2>ХАРАКТЕРИСТИКИ</h2><div class="stat">👊 Сила <b id="power">5</b><div class="bar"><div class="fill" id="pbar"></div></div></div><div class="stat">🛡️ Защита <b id="def">5</b><div class="bar"><div class="fill" id="dbar"></div></div></div><div class="stat">⭐ Авторитет <b id="auth">0</b><div class="bar"><div class="fill" id="abar"></div></div></div></section></aside>
</main>
<nav class="bottom"><button data-open="gear"><img src="./jacket.svg">ШМОТ</button><button data-open="tattoo"><span class="emoji">☠️</span>НАКОЛКИ</button><button data-open="deals"><span class="emoji">📜</span>ДЕЛА</button><button data-open="train"><span class="emoji">🏋️</span>ТРЕНИРОВКА</button><button data-open="boss"><span class="emoji">😠</span>БОССЫ</button><button data-open="gang"><span class="emoji">👥</span>БАНДЫ</button><button data-open="collection"><span class="emoji">🏆</span>КОЛЛЕКЦИИ</button><button data-open="shop"><span class="emoji">🧰</span>МАГАЗИН</button></nav>
</div><div class="rotate">Поверни iPhone горизонтально</div>
<script>
(()=>{const K='zona-v03';const defaults={level:1,xp:0,energy:10,money:750,coins:7,power:5,def:5,auth:0,bossHp:90,owned:[],equipped:[],tattoos:[],collection:[],gang:false};
let s=defaults;try{s={...defaults,...JSON.parse(localStorage.getItem(K)||'{}')}}catch(e){}
const $=x=>document.getElementById(x), items=[
{id:'jacket',name:'Кожанка «Север»',price:350,stat:'+2 защита',img:'jacket.svg',type:'Одежда'},
{id:'boots',name:'Берцы «Бетон»',price:420,stat:'+2 сила',img:'boots.svg',type:'Обувь'},
{id:'chain',name:'Цепь «Вес»',price:300,stat:'+3 авторитета',img:'chain.svg',type:'Аксессуар'},
{id:'glasses',name:'Очки «Тень»',price:260,stat:'+1 защита',img:'glasses.svg',type:'Аксессуар'},
{id:'hat',name:'Шапка «Север»',price:280,stat:'+1 сила',img:'hat.svg',type:'Головной убор'},
{id:'watch',name:'Часы «Ход»',price:500,stat:'+5 авторитета',img:'watch.svg',type:'Аксессуар'}];
const status=()=>s.auth>=100?'Авторитет':s.auth>=50?'Блатной':s.auth>=20?'Свой':'Новенький';
function save(){localStorage.setItem(K,JSON.stringify(s));render()}
function render(){$('status').textContent=status();$('level').textContent=s.level;$('xp').textContent=s.xp;$('energy').textContent=s.energy;$('money').textContent=s.money;$('coins').textContent=s.coins;$('power').textContent=s.power;$('def').textContent=s.def;$('auth').textContent=s.auth;$('pbar').style.width=Math.min(100,s.power*6)+'%';$('dbar').style.width=Math.min(100,s.def*6)+'%';$('abar').style.width=Math.min(100,s.auth)+'%';items.forEach(i=>$('ov-'+i.id)?.classList.toggle('on',s.equipped.includes(i.id)));$('yard').classList.toggle('lock',s.auth<20)}
function toast(t){let e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.zt);window.zt=setTimeout(()=>e.classList.remove('show'),1700)}
function xp(n){s.xp+=n;while(s.xp>=100){s.xp-=100;s.level++;s.energy=10;s.power++;toast('Новый уровень '+s.level+'!')}}
function open(title,body){$('drawTitle').textContent=title;$('drawBody').innerHTML=body;$('drawer').classList.add('open');wire()}
function cards(mode){return '<div class="grid">'+items.map(i=>{let own=s.owned.includes(i.id),eq=s.equipped.includes(i.id);return `<div class="card ${eq?'selected':''}"><img class="art" src="./${i.img}"><span class="tag">${i.type}</span><h3>${i.name}</h3><div class="muted">${i.stat}</div>${mode==='shop'?`<div class="price">${i.price} ₽</div><button class="btn buy" data-id="${i.id}" ${own?'disabled':''}>${own?'Куплено':'Купить'}</button>`:`<button class="btn equip" data-id="${i.id}" ${own?'':'disabled'}>${!own?'Не куплено':eq?'Снять':'Надеть'}</button>`}</div>`}).join('')+'</div>'}
function show(k){if(k==='shop')open('МАГАЗИН',cards('shop'));if(k==='gear')open('ШМОТ И АКСЕССУАРЫ','<p class="muted">Купленные вещи можно надевать и снимать. Они появляются прямо на персонаже.</p>'+cards('gear'));
if(k==='tattoo')open('НАКОЛКИ',`<div class="grid"><div class="card"><div class="art" style="display:grid;place-items:center;font-size:55px">☠️</div><h3>Череп Шрама</h3><div class="muted">${s.tattoos.includes('Череп Шрама')?'Получена · +3 сила':'Победи Шрама, чтобы получить'}</div></div><div class="card"><div class="art" style="display:grid;place-items:center;font-size:55px">🕷️</div><h3>Паук</h3><div class="muted">Откроется у следующего босса</div></div></div>`);
if(k==='deals')open('ДЕЛА',`<div class="grid"><div class="card"><h3>Посылка</h3><p class="muted">⚡2 · +120 ₽ · +4 авторитета</p><button class="btn deal">Сделать</button></div><div class="card"><h3>Разговор по душам</h3><p class="muted">⚡1 · +60 ₽ · +10 XP</p><button class="btn deal2">Сделать</button></div></div>`);
if(k==='train')open('ТРЕНИРОВКА',`<div class="card"><div class="art" style="display:grid;place-items:center;font-size:60px">🏋️</div><h3>Качалка</h3><p class="muted">3 энергии → +1 сила и +8 XP</p><button class="btn train">Тренироваться</button></div>`);
if(k==='boss')open('БОССЫ',`<div class="bossbox"><div class="bossface">😠</div><div><h2>ШРАМ</h2><p class="muted">Первый серьёзный противник. За победу: 500 ₽, 15 авторитета и уникальная наколка.</p><div class="bar"><div class="fill" style="width:${Math.max(0,s.bossHp/90*100)}%"></div></div><p>❤️ ${Math.max(0,s.bossHp)}/90</p><button class="btn hit">Ударить · ⚡2</button></div></div>`);
if(k==='gang')open('БАНДЫ',`<div class="card"><h3>${s.gang?'Банда «Северный блок»':'Ты пока один'}</h3><p class="muted">${s.gang?'Участников: 1 · Репутация: '+s.auth:'Создай свою первую банду. В следующих версиях сюда добавим онлайн-участников.'}</p><button class="btn gang">${s.gang?'Покинуть':'Создать банду'}</button></div>`);
if(k==='collection')open('КОЛЛЕКЦИИ',`<div class="grid"><div class="card"><div class="art" style="display:grid;place-items:center;font-size:50px">🧥</div><h3>Уличный комплект</h3><p class="muted">${['jacket','boots','chain'].filter(x=>s.owned.includes(x)).length}/3 предмета</p></div><div class="card"><div class="art" style="display:grid;place-items:center;font-size:50px">☠️</div><h3>Наколки</h3><p class="muted">${s.tattoos.length}/2 найдено</p></div></div>`)}
function wire(){document.querySelectorAll('.buy').forEach(b=>b.onclick=()=>{let i=items.find(x=>x.id===b.dataset.id);if(s.money<i.price)return toast('Не хватает денег');s.money-=i.price;s.owned.push(i.id);save();show('shop');toast('Куплено: '+i.name)});
document.querySelectorAll('.equip').forEach(b=>b.onclick=()=>{let id=b.dataset.id;if(!s.owned.includes(id))return;if(s.equipped.includes(id))s.equipped=s.equipped.filter(x=>x!==id);else s.equipped.push(id);save();show('gear')});
document.querySelector('.train')?.addEventListener('click',()=>{if(s.energy<3)return toast('Не хватает энергии');s.energy-=3;s.power++;xp(8);save();show('train');toast('+1 сила')});
document.querySelector('.deal')?.addEventListener('click',()=>{if(s.energy<2)return toast('Не хватает энергии');s.energy-=2;s.money+=120;s.auth+=4;xp(12);save();show('deals')});
document.querySelector('.deal2')?.addEventListener('click',()=>{if(s.energy<1)return toast('Не хватает энергии');s.energy--;s.money+=60;xp(10);save();show('deals')});
document.querySelector('.hit')?.addEventListener('click',()=>{if(s.energy<2)return toast('Не хватает энергии');s.energy-=2;let d=s.power+Math.floor(Math.random()*7)+3;s.bossHp-=d;if(s.bossHp<=0){s.money+=500;s.auth+=15;if(!s.tattoos.includes('Череп Шрама')){s.tattoos.push('Череп Шрама');s.power+=3}s.bossHp=90;toast('Шрам побеждён!')}else toast('Урон '+d);save();show('boss')});
document.querySelector('.gang')?.addEventListener('click',()=>{s.gang=!s.gang;save();show('gang')})}
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>show(b.dataset.open));$('close').onclick=()=>$('drawer').classList.remove('open');
document.querySelectorAll('.taskbtn').forEach(b=>b.onclick=()=>{let a=[[1,50,10,2],[2,90,15,3],[3,150,25,5]][+b.dataset.t];if(s.energy<a[0])return toast('Не хватает энергии');s.energy-=a[0];s.money+=a[1];xp(a[2]);s.auth+=a[3];save();toast('Задание выполнено')});
$('yard').onclick=()=>toast(s.auth>=20?'Двор открыт. Локацию добавим следующим этапом.':'Нужен статус «Свой» — 20 авторитета');$('fight').onclick=()=>toast('Разборки откроются после победы над Шрамом');render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})})();
</script></body></html>
