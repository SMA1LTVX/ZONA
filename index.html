<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#111315"><title>ЗОНА: Авторитет</title><link rel="manifest" href="manifest.webmanifest"><style>
*{box-sizing:border-box}body{margin:0;background:#0b0d0e;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:480px;margin:auto;min-height:100vh;background:linear-gradient(#171a1c,#0c0e0f);padding:env(safe-area-inset-top) 14px calc(84px + env(safe-area-inset-bottom))}.top{padding:16px 2px 12px}.brand{font-size:12px;letter-spacing:3px;color:#9ca3a8}.title{font-size:27px;font-weight:900;margin-top:2px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat,.card{background:#171a1d;border:1px solid #292d31;border-radius:14px}.stat{padding:10px;text-align:center}.stat b{display:block;font-size:17px}.stat span{font-size:11px;color:#9ba1a6}.hero{height:210px;margin:8px 0 12px;border-radius:18px;border:1px solid #34383c;overflow:hidden;position:relative;background:radial-gradient(circle at 70% 30%,#4a4d48 0,#242725 25%,#111 68%)}.bars{position:absolute;inset:14px}.avatar{position:absolute;right:26px;bottom:0;width:150px;height:180px;background:linear-gradient(150deg,#777 0 28%,#343434 29% 70%,#191919 71%);clip-path:polygon(30% 0,67% 0,76% 20%,91% 43%,80% 100%,13% 100%,4% 44%,23% 20%);opacity:.9}.rank{position:absolute;left:16px;bottom:16px}.rank small{color:#a7adaf}.rank strong{display:block;font-size:22px}.progress{height:7px;background:#282c2f;border-radius:20px;margin-top:6px;overflow:hidden}.progress i{display:block;height:100%;background:#b99052;width:0%}.section{font-weight:800;margin:16px 2px 8px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:1px solid #353a3e;background:#1b1f22;color:#fff;border-radius:14px;padding:15px 10px;font-weight:800;font-size:15px}.btn.primary{background:#9b743b;border-color:#b88c4d;color:#fff}.btn:active{transform:scale(.98)}.card{padding:14px}.job{display:flex;align-items:center;justify-content:space-between;gap:10px}.job p{margin:4px 0;color:#aeb3b6;font-size:13px}.job button{min-width:96px}.log{margin-top:10px;font-size:13px;color:#c9cdcf;min-height:42px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);display:grid;grid-template-columns:repeat(4,1fr);padding:9px 8px calc(9px + env(safe-area-inset-bottom));background:#111416eF;border-top:1px solid #2b3033;backdrop-filter:blur(12px)}.nav button{border:0;background:none;color:#92999d;font-size:11px;padding:7px 2px}.nav b{display:block;font-size:20px;margin-bottom:2px}.overlay{display:none;position:fixed;inset:0;background:#080a0bd9;z-index:5;padding:40px 16px;overflow:auto}.overlay.show{display:block}.panel{max-width:450px;margin:auto;background:#171a1d;border:1px solid #34393d;border-radius:18px;padding:16px}.panel h2{margin-top:0}.item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #292e31}.close{width:100%;margin-top:14px}.boss{font-size:52px;text-align:center;margin:10px}.hp{font-size:12px;color:#bbb;text-align:center}
</style></head><body><main class="app"><header class="top"><div class="brand">ЗОНА</div><div class="title">АВТОРИТЕТ</div><div class="stats"><div class="stat"><b id="money">250 ₽</b><span>наличные</span></div><div class="stat"><b id="energy">10/10</b><span>энергия</span></div><div class="stat"><b id="lvl">1</b><span>уровень</span></div></div></header><section class="hero"><div class="avatar"></div><div class="rank"><small>Твой статус</small><strong id="rank">Новичок</strong><div class="progress"><i id="xpbar"></i></div><small id="xptext">0 / 100 опыта</small></div></section><div class="section">Дела</div><section class="card"><div class="job"><div><b>Разгрузить передачу</b><p>−2 энергии · +20–45 ₽ · +12 опыта</p></div><button class="btn primary" id="work">Сделать</button></div><div class="log" id="log">Ты только прибыл. Начни с простых дел и заработай авторитет.</div></section><div class="section">Быстрые действия</div><div class="actions"><button class="btn" id="fight">⚔️ Первый бой</button><button class="btn" id="shop">🎒 Шмот</button></div></main><nav class="nav"><button id="nwork"><b>✊</b>Дела</button><button id="nfight"><b>⚔️</b>Бой</button><button id="nshop"><b>🎒</b>Шмот</button><button id="profile"><b>👤</b>Профиль</button></nav><div class="overlay" id="modal"><div class="panel" id="panel"></div></div><script>
const S={money:250,energy:10,xp:0,lvl:1,power:5,items:[]};const $=id=>document.getElementById(id);function rank(){return S.lvl>=5?'Смотрящий':S.lvl>=3?'Бывалый':S.lvl>=2?'Свой':'Новичок'}function draw(){while(S.xp>=100){S.xp-=100;S.lvl++;S.energy=10;S.power+=2;$('log').textContent='Новый уровень! Энергия восстановлена.'}$('money').textContent=S.money+' ₽';$('energy').textContent=S.energy+'/10';$('lvl').textContent=S.lvl;$('rank').textContent=rank();$('xpbar').style.width=S.xp+'%';$('xptext').textContent=S.xp+' / 100 опыта'}function work(){if(S.energy<2){$('log').textContent='Энергия закончилась. В прототипе она восстанавливается при новом уровне.';return}let r=20+Math.floor(Math.random()*26);S.energy-=2;S.money+=r;S.xp+=12;$('log').textContent='Дело выполнено: +'+r+' ₽ и +12 опыта.';draw()}function open(html){$('panel').innerHTML=html+'<button class="btn close" id="close">Закрыть</button>';$('modal').classList.add('show');$('close').onclick=()=>$('modal').classList.remove('show')}function fight(){let hp=28+S.lvl*6;open('<h2>Первый противник</h2><div class="boss">🥊</div><div class="hp">Сила противника: '+hp+'</div><p>Твоя сила: '+S.power+'. На бой требуется 3 энергии.</p><button class="btn primary" id="hit">Вступить в бой</button>');$('hit').onclick=()=>{if(S.energy<3){alert('Не хватает энергии');return}S.energy-=3;let chance=Math.min(.85,.42+S.power/(hp*1.8));if(Math.random()<chance){let reward=80+S.lvl*15;S.money+=reward;S.xp+=30;$('log').textContent='Победа! +'+reward+' ₽, +30 опыта.';alert('Победа!')}else{$('log').textContent='Поражение. Усиль персонажа с помощью шмота.';alert('Поражение.')}draw();$('modal').classList.remove('show')}}function shop(){let items=[['Телогрейка',120,2],['Крепкие ботинки',220,4],['Перстень',400,7]];open('<h2>Шмот</h2><p>Экипировка навсегда увеличивает силу.</p>'+items.map((x,i)=>'<div class="item"><div><b>'+x[0]+'</b><br><small>+'+x[2]+' силы · '+x[1]+' ₽</small></div><button class="btn" data-buy="'+i+'">Купить</button></div>').join(''));document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{let x=items[+b.dataset.buy];if(S.items.includes(x[0]))return alert('Уже куплено');if(S.money<x[1])return alert('Не хватает денег');S.money-=x[1];S.power+=x[2];S.items.push(x[0]);draw();shop()})}function profile(){open('<h2>Профиль</h2><p><b>'+rank()+'</b> · уровень '+S.lvl+'</p><p>Сила: '+S.power+'</p><p>Шмот: '+(S.items.join(', ')||'пока пусто')+'</p><p>Это первая локальная версия. После подключения сервера здесь появятся аккаунт, сохранения и рейтинг.</p>')}$('work').onclick=work;$('nwork').onclick=()=>window.scrollTo({top:260,behavior:'smooth'});$('fight').onclick=$('nfight').onclick=fight;$('shop').onclick=$('nshop').onclick=shop;$('profile').onclick=profile;$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};draw();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
